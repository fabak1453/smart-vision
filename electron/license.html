<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smart Vision ERP — License</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', system-ui, sans-serif; background:#faf9f6; color:#1c1b18;
         display:flex; align-items:center; justify-content:center; height:100vh; }
  .card { width:480px; background:#fff; border:1px solid #e7e3da; border-radius:14px;
          padding:28px 30px; box-shadow:0 10px 30px rgba(0,0,0,.06); }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:#8a857a; font-size:13px; margin:0 0 18px; }
  .status { padding:10px 12px; border-radius:9px; font-size:13px; margin-bottom:16px;
            background:#f4f1ea; border:1px solid #e7e3da; }
  .status.warn { background:#fdf3e7; border-color:#f0d9b8; color:#8a5a12; }
  .status.ok   { background:#eef7ee; border-color:#cfe6cf; color:#1e6b2e; }
  .status.bad  { background:#fdecec; border-color:#f2c8c8; color:#a12a2a; }
  label { display:block; font-size:12px; font-weight:600; color:#6d6759; margin:14px 0 6px;
          text-transform:uppercase; letter-spacing:.4px; }
  input, textarea { width:100%; padding:10px 12px; border:1px solid #ddd8cc; border-radius:9px;
                    font-size:13px; outline:none; }
  textarea { font-family:Consolas, monospace; height:110px; resize:none; font-size:12px; }
  input:focus, textarea:focus { border-color:#b9a97e; }
  button { padding:10px 16px; border:none; border-radius:9px; font-size:13px; font-weight:600;
           cursor:pointer; }
  .primary { background:#1c1b18; color:#fff; width:100%; margin-top:16px; padding:12px; font-size:14px; }
  .primary:hover { background:#33312c; }
  .msg { min-height:20px; font-size:13px; margin-top:10px; text-align:center; }
  .msg.ok { color:#1e6b2e; } .msg.bad { color:#a12a2a; }
  .hint { font-size:12px; color:#8a857a; margin-top:14px; text-align:center; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <h1>Smart Vision ERP</h1>
  <p class="sub">Product activation</p>

  <div class="status" id="status">Checking license…</div>

  <label>License Serial</label>
  <textarea id="key" placeholder="Paste your serial here (starts with SVE1.)"></textarea>

  <button class="primary" id="activate">Activate</button>
  <div class="msg" id="msg"></div>

  <p class="hint">Paste the serial from Smart Vision Enterprise and click Activate.<br>
  One serial works on any computer.</p>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  async function refresh() {
    const st = await window.svLicense.info();
    const el = $('status');
    el.textContent = st.message;
    el.className = 'status ' + (st.mode === 'licensed' ? 'ok' : st.mode === 'trial' ? 'warn' : 'bad');
  }
  $('activate').onclick = async () => {
    const m = $('msg'); m.textContent = 'Checking…'; m.className = 'msg';
    const r = await window.svLicense.activate($('key').value);
    m.textContent = r.message; m.className = 'msg ' + (r.ok ? 'ok' : 'bad');
    if (r.ok) refresh();
  };
  refresh();
</script>
</body>
</html>
